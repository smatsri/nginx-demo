services:
  # web:
  #   build: ./server
  #   container_name: express_app
  #   expose:
  #     - 3000
  #   networks:
  #     - app-network

  nginx:
    image: openresty/openresty:alpine
    container_name: nginx_proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - nginx_cache:/var/cache/nginx
    command: sh -c "addgroup -S nginx && adduser -S nginx -G nginx && mkdir -p /var/cache/nginx && chown -R nginx:nginx /var/cache/nginx && nginx -g 'daemon off;'"
    depends_on:
      - ui
    networks:
      - app-network

  ui:
    image: nextjs-app
    container_name: next_app
    ports:
      - "3000:3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  nginx_cache:
