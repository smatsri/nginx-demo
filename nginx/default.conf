proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=1h use_temp_path=off;

server {
  listen 80;

  location / {
    proxy_pass http://ui:3000;

    # Cache configuration
    proxy_cache STATIC;
    proxy_cache_valid 200 302 60s;
    proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    # Allow shared caches
    proxy_ignore_headers Set-Cookie;

    # Hide internal cache control headers
    proxy_hide_header App-Cache-Control;
    proxy_hide_header Cache-Control;

    # Use custom app header to control cache behavior
    more_set_headers "Cache-Control: $upstream_http_app_cache_control";

    # Optional debugging headers
    add_header X-Proxy-Cache $upstream_cache_status;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /search {
    # Cache configuration
    proxy_cache STATIC;
    proxy_cache_valid 200 302 60s;
    proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    # Hide internal cache control headers
    proxy_hide_header App-Cache-Control;
    proxy_hide_header Cache-Control;

    # Use custom app header to control cache behavior
    more_set_headers "Cache-Control: $upstream_http_app_cache_control";

    # Extract "year" param from query string if present
    if ($arg_year != "") {
      set $new_args "year=$arg_year";
    }

    # Reconstruct the request with only allowed params
    rewrite ^/search$ /search?$new_args? break;

    proxy_pass http://ui:3000;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection '';

    # Optional debugging headers
    add_header X-Proxy-Cache $upstream_cache_status;
  }
}
